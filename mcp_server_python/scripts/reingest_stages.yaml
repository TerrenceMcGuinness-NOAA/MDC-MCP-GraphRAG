# reingest_stages.yaml — stage catalog for the COTS full re-ingest Ralph loop.
#
# Spec: .kiro/specs/cots-reingest-ralph-loop/ (Task 1.1).
#       .kiro/specs/mpnet768-tenant-reingest-aug2026/ (Task 2).
# Consumed by: reingest_state.py (State_Manager) to build the Work_Matrix
#   (Tenant_Catalog x per_tenant_stages + global_stages).
#
# Each stage is a Reingest_Unit template. The State_Manager stamps the
# per-tenant fields (tenant_id, branch, workflow_subdir, label_prefix,
# index_prefix, lifecycle, mode) onto each unit so a unit is self-describing
# without re-reading the catalog (Requirement 2.2).
#
# Field reference
# ---------------
#   name                Stage token (1:1 with an ingester or probe).
#   scope               shared | tenant | hybrid_external | hybrid_local
#                       Determines whether the stage emits one global unit
#                       (shared/hybrid_external) or per-tenant units
#                       (tenant/hybrid_local). Phase 81 addition.
#   shared_once         bool (default false). When true AND scope is shared or
#                       hybrid_external, the Work_Matrix emits exactly one unit
#                       (tenant_id="__global__"). Belt-and-braces for the
#                       Shared_Once_Rule.
#   order               Sort key for State_Manager `next` selection (lower
#                       runs first). worktree/reset sort earliest.
#   kind                prep | destructive | vector | dual | graph | validate
#                       (drives which Validation_Probe the iteration runs and
#                        whether --mode / --collection-version are passed).
#   script              Executable the iteration invokes. `null` means the
#                       stage is handled inline by the iteration prompt (e.g.
#                       `validate` calls MCP tools, not a script).
#   depends_on          Same-tenant stage names that MUST be terminal
#                       (done/skipped) before this unit is actionable
#                       (Requirement 8.6). Enforced by `reingest_state.py next`.
#   depends_on_all_tenants  bool (default false). When true, the depends_on
#                       stages must be terminal for EVERY tenant (not just the
#                       current unit's tenant). Used by neo4j_rebuild_indexes
#                       to gate on all per-tenant graph stages. Phase 81.
#   destructive         true => requires CONFIRM_DESTRUCTIVE=yes (Requirement 11.4).
#   optional            true => failure/absence does not block run completion
#                       (Requirement 13.1 — community_summaries).
#   probe               Validation_Probe selector (Requirement 10):
#                         none | vector | dual | graph_shell | graph_fortran
#                         | graph_expdir | graph_rocoto | graph_bridge | integrity
#   source_precondition Human description + optional machine `check`
#                       {path (relative to workflow_root), min_files}. When the
#                       precondition is unmet the iteration marks the unit
#                       `skipped` with a reason (Requirement 7.4). Where the
#                       check is not a simple sub-path (e.g. EXPDIR lives outside
#                       the tenant tree) `check` is null and the iteration
#                       evaluates the description.

schema_version: 2

# Default per-unit retry cap; overridable via `reingest_state.py init --attempt-cap`.
attempt_cap_default: 3

# ---------------------------------------------------------------------------
# Per-tenant stages (Tenant_Catalog x these). Ordered; depends_on is scoped to
# the SAME tenant unless depends_on_all_tenants is true.
# ---------------------------------------------------------------------------
per_tenant_stages:
  - name: worktree
    scope: tenant
    shared_once: false
    order: 10
    kind: prep
    script: setup_pw_workflow_mount.sh
    depends_on: []
    destructive: false
    optional: false
    probe: none
    source_precondition: null

  - name: reset
    scope: tenant
    shared_once: false
    order: 20
    kind: destructive
    script: reset_tenant_cots.py
    depends_on: [worktree]
    destructive: true
    optional: false
    probe: none
    source_precondition: null

  # ─── hybrid domain: workflow_docs — external portion (shared-once) ────
  - name: workflow_docs_external
    scope: shared
    shared_once: true
    order: 25
    kind: vector
    script: ingest_documentation_v9.py
    args: ["--sources", "rocoto,cmeps,nceplibs-sfcio,esmf-ref-pdf,esmc-ref-pdf,nuopc-ref-pdf,esmpy-pdf,nuopc-layer-reference"]
    depends_on: []
    destructive: false
    optional: false
    probe: vector
    source_precondition:
      description: "external documentation URLs reachable (rocoto, cmeps, nceplibs-sfcio, PDFs)"
      check: null

  # ─── hybrid domain: workflow_docs — PDF freshness sub-stage ───────────
  - name: pdf_sources
    scope: shared
    shared_once: true
    order: 26
    kind: vector
    script: ingest_documentation_v9.py
    args: ["--sources", "esmf-ref-pdf,esmc-ref-pdf,nuopc-ref-pdf,esmpy-pdf,nuopc-layer-reference",
           "--writeback-last-modified"]
    depends_on: [workflow_docs_external]
    destructive: false
    optional: false
    probe: vector
    source_precondition:
      description: "PDF source URLs reachable for Last-Modified writeback"
      check: null

  # ─── hybrid domain: workflow_docs — local portion (per-tenant) ────────
  - name: workflow_docs_local
    scope: hybrid_local
    shared_once: false
    order: 30
    kind: vector
    script: ingest_documentation_v9.py
    args: ["--sources", "global-workflow-rst"]
    depends_on: [worktree]
    destructive: false
    optional: false
    probe: vector
    source_precondition:
      description: "documentation files present under the tenant worktree (docs/ or repo-local markdown)"
      check:
        path: docs
        min_files: 1

  # ─── per-tenant vector: code_with_context_local ───────────────────────
  - name: code_with_context_local
    scope: tenant
    shared_once: false
    order: 40
    kind: vector
    script: ingest_code_v9.py
    args: ["--sources", "fortran-code-context,shell-code-context,python-code-context,rocoto-config,expdir-configs"]
    depends_on: [reset]
    destructive: false
    optional: false
    probe: vector
    source_precondition:
      description: "tenant source tree present"
      check:
        path: .
        min_files: 1

  - name: jjobs
    scope: tenant
    shared_once: false
    order: 50
    kind: vector
    script: ingest_jjobs_v8.py
    depends_on: [reset]
    destructive: false
    optional: false
    probe: vector
    source_precondition:
      description: "J-Job scripts present under dev/jobs/ or jobs/"
      check:
        path: jobs
        min_files: 1

  - name: config
    scope: tenant
    shared_once: false
    order: 60
    kind: dual
    script: ingest_config_files_v8.py
    depends_on: [reset]
    destructive: false
    optional: false
    probe: dual
    source_precondition:
      description: "parm/config/{gfs,gefs,gcafs,sfs} present"
      check:
        path: parm/config
        min_files: 1

  - name: shell_graph
    scope: tenant
    shared_once: false
    order: 70
    kind: graph
    script: ingest_shell_graph_v8.py
    depends_on: [reset]
    destructive: false
    optional: false
    probe: graph_shell
    source_precondition:
      description: "shell scripts present (ush/ scripts/ jobs/)"
      check:
        path: ush
        min_files: 1

  - name: fortran_graph
    scope: tenant
    shared_once: false
    order: 80
    kind: graph
    script: ingest_fortran_graph_v8.py
    depends_on: [reset]
    destructive: false
    optional: false
    probe: graph_fortran
    source_precondition:
      description: "sorc/ submodules initialized (>1000 files); else skip (bridge degrades to shell-only)"
      check:
        path: sorc
        min_files: 1000

  - name: expdir
    scope: tenant
    shared_once: false
    order: 90
    kind: graph
    script: ingest_expdir_configs_v8.py
    depends_on: [reset]
    destructive: false
    optional: false
    probe: graph_expdir
    source_precondition:
      description: "materialized supported_repos/EXPDIR* tree for this tenant; check null (EXPDIR lives outside workflow_root, iteration evaluates)"
      check: null

  - name: rocoto
    scope: tenant
    shared_once: false
    order: 100
    kind: graph
    script: ingest_rocoto_xml_v8.py
    depends_on: [config, shell_graph, expdir]
    destructive: false
    optional: false
    probe: graph_rocoto
    source_precondition:
      description: "EXPDIR *.xml Rocoto definitions present; check null (reads EXPDIR outside workflow_root)"
      check: null

  - name: bridge
    scope: tenant
    shared_once: false
    order: 110
    kind: graph
    script: create_shell_fortran_bridge.py
    depends_on: [shell_graph, fortran_graph]
    destructive: false
    optional: false
    probe: graph_bridge
    source_precondition: null

  - name: validate
    scope: tenant
    shared_once: false
    order: 200
    kind: validate
    script: null
    depends_on:
      - code_with_context_local
      - jjobs
      - config
      - shell_graph
      - fortran_graph
      - expdir
      - rocoto
      - bridge
      - workflow_docs_local
    destructive: false
    optional: false
    probe: integrity
    source_precondition: null

# ---------------------------------------------------------------------------
# Global stages (run once, NOT per-tenant). tenant_id == "__global__".
# ---------------------------------------------------------------------------
global_stages:
  # ─── Neo4j index drop (first, before any graph writes) ───────────────
  - name: neo4j_drop_indexes
    scope: shared
    shared_once: true
    order: 5
    kind: prep
    script: neo4j_index_rebuild.py
    args: ["drop", "--i-mean-it", "Target_Version=v9-0-0",
           "--snapshot", ".reingest_state/v9-0-0/neo4j_pre_drop.json"]
    depends_on: []
    destructive: true
    optional: false
    probe: none
    source_precondition:
      description: "Neo4j accessible and contains indexes to drop"
      check: null

  # ─── shared-once vector stages ───────────────────────────────────────
  - name: ee2_standards
    scope: shared
    shared_once: true
    order: 300
    kind: vector
    script: ingest_ee2_v7.py
    depends_on: [neo4j_drop_indexes]
    destructive: false
    optional: false
    probe: vector
    source_precondition:
      description: "supported_repos/nws-hpc-standards present; check null (outside any tenant worktree)"
      check: null

  - name: community_summaries
    scope: shared
    shared_once: true
    order: 310
    kind: graph
    # Gap J: Neo4j GDS Leiden + Node-only pipeline (mcp_server_node/). Optional
    # and non-blocking (Requirement 13). Skipped with the Gap-J rationale where
    # GDS is unavailable on the COTS Neo4j Community instance or the Python port
    # does not exist. See .kiro/steering/12-multi-tenant-gap-tracker.md Gap J.
    script: null
    depends_on: [neo4j_drop_indexes]
    destructive: false
    optional: true
    probe: none
    source_precondition:
      description: "Neo4j GDS plugin present on COTS + a runnable community-detection pipeline; otherwise skip (Gap J)"
      check: null

  - name: ci_test_cases
    scope: shared
    shared_once: true
    order: 320
    kind: vector
    script: ingest_ci_test_cases_v9.py
    depends_on: [neo4j_drop_indexes]
    destructive: false
    optional: false
    probe: vector
    source_precondition:
      description: "CI test case definitions present"
      check: null

  # ─── Neo4j index rebuild (after all per-tenant graph stages) ─────────
  - name: neo4j_rebuild_indexes
    scope: shared
    shared_once: true
    order: 400
    kind: prep
    script: neo4j_index_rebuild.py
    args: ["create", "--target-version", "v9-0-0"]
    depends_on: [fortran_graph, shell_graph, bridge, rocoto, expdir]
    depends_on_all_tenants: true
    destructive: false
    optional: false
    probe: none
    source_precondition:
      description: "All per-tenant graph stages terminal for every tenant"
      check: null
