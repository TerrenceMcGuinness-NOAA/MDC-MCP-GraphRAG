[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdc-mcp-rag-python"
version = "1.0.0"
description = "Python port of the MDC MCP/RAG Server (FastMCP + Strands Agents)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "NOAA MDC / Enterprise Infrastructure Branch" }
]

# Runtime dependencies — pinned per Requirement 18.6.
# Versions tracked against the current AL2023 ARM64 EC2 host; update
# together when bumping the Dockerfile base image.
dependencies = [
    "fastmcp==3.2.4",
    "opensearch-py==3.2.0",
    "boto3==1.42.70",
    "botocore==1.42.70",
    "urllib3==2.6.3",
    "httpx==0.28.1",
    "strands-agents==1.39.0",
    "strands-agents-tools==0.5.2",
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
]

[project.optional-dependencies]
# COTS (Commercial Off-The-Shelf) backend clients — the Parallel Works
# on-prem stack (DB_BACKEND=cots). Not needed on AgentCore (AWS backend uses
# opensearch-py + boto3). Versions pinned to match the Spack install the stdio
# server loads (py-neo4j@5.25.0; chromadb 1.3.4 in the Spack Python env), so the
# gateway container and the stdio host wire identical adapters.
cots = [
    "chromadb==1.3.4",
    "neo4j==5.25.0",
    # Local embedding model for the mpnet768 profile — the COTS ChromaDB
    # collections are 768-dim (mpnet), so semantic_search / ee2_compliance /
    # operational / branch_isolation need sentence-transformers to embed
    # queries (Bedrock/Titan is unavailable on Parallel Works). Pinned to the
    # Spack install the stdio server loads (sentence-transformers 5.1.2,
    # py-torch@2.9.0, py-transformers@4.57.0). CPU torch keeps the image small;
    # embeddings are identical to the GPU build for the mpnet encoder.
    "sentence-transformers==5.1.2",
    "torch==2.9.0+cpu",
]
test = [
    "pytest==8.4.2",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.152.2",
    "pytest-cov==7.1.0",
]

[project.scripts]
mdc-mcp-rag = "src.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "property: property-based tests (Hypothesis)",
    "parity: dual-server parity tests (requires Node.js + Python running)",
    "unit: fast unit tests",
]
