# docker-compose.staging.yaml
# Environment: env/staging branch
# Purpose: Pre-production validation environment
#
# Usage:
#   docker compose -f docker-compose.staging.yaml up -d
#   docker compose -f docker-compose.staging.yaml down
#
# MCP_ENV: staging
# Note: This is a READ-ONLY environment for validation

services:
  # ============================================================================
  # ChromaDB Vector Database (Staging)
  # ============================================================================
  chromadb:
    image: ${CI_REGISTRY:-registry.gitlab-licensed.vlab.noaa.gov}/nws/operations/ncep/emc/eib/eib-mcp-rag-server/chromadb:v134clean
    container_name: chromadb-staging
    ports:
      - "8080:8000"
    volumes:
      - chromadb-staging-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - CHROMA_HOST=0.0.0.0
      - CHROMA_PORT=8000
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================================================
  # Neo4j Graph Database (Staging)
  # ============================================================================
  neo4j:
    image: neo4j:5.26.20-community
    container_name: neo4j-staging
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-staging-data:/data
      - neo4j-staging-logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_STAGING_PASSWORD:-staging_secure_password}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================================================
  # MCP RAG Server (Staging)
  # ============================================================================
  mcp-server:
    image: ${CI_REGISTRY:-registry.gitlab-licensed.vlab.noaa.gov}/nws/operations/ncep/emc/eib/eib-mcp-rag-server/mcp-server:env-staging
    container_name: mcp-server-staging
    depends_on:
      chromadb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - MCP_ENV=staging
      - MCP_SCENARIO=full
      - ENABLE_RAG=true
      - CHROMA_SERVER_URL=http://chromadb:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTH=neo4j/${NEO4J_STAGING_PASSWORD:-staging_secure_password}
    volumes:
      - mcp-server-staging-logs:/app/logs
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

# CRITICAL: All volumes use bind mounts to persistent storage on /mcp_rag_eib
# /var/lib/docker/volumes/ is ephemeral on VMs and will be lost on reprovisioning
volumes:
  chromadb-staging-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/chromadb
  neo4j-staging-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/data
  neo4j-staging-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/logs
  mcp-server-staging-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/mcp-server/logs

networks:
  default:
    name: mcp-staging-network
