# Docker MCP Gateway — GitHub token drop-in (Phase 63b)
#
# Canonical copy of the live drop-in installed at:
#   /etc/systemd/system/mcp-gateway.service.d/10-github-token.conf
#
# Install:
#   sudo mkdir -p /etc/systemd/system/mcp-gateway.service.d
#   sudo cp SETUP/docker-mcp/systemd/mcp-gateway.service.d/10-github-token.conf \
#           /etc/systemd/system/mcp-gateway.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart mcp-gateway.service
#
# Overrides ExecStart to run the launch wrapper, which bridges GITHUB_TOKEN from
# the shell secrets SPOT into docker-mcp's --secrets switch. Kept in a wrapper
# (not inline ExecStart) so systemd's own $VAR expansion does not mangle the shell.
[Service]
ExecStart=
ExecStart=/mcp_rag_eib/eib-mcp-rag-server/SETUP/docker-mcp/mcp-gateway-launch.sh
