# EIB MCP RAG Server Catalog - v3 format (SPOT - Single Point of Truth)
# Canonical location: SETUP/docker-mcp/catalogs/eib-local.yaml (persistent drive)
# Created by: SETUP/provisioning/11-docker-mcp-gateway.sh
# Used by: docker mcp gateway run --catalog <this-file>
# Transport: streaming (Streamable HTTP - MCP spec 2025-06-18)
#
# IMPORTANT: The 'docker mcp catalog create' command OVERWRITES files in
# ~/.docker/mcp/. This file on the persistent drive is the canonical copy.
# The gateway --catalog flag accepts absolute paths, bypassing ~/.docker/mcp/.

version: 3
name: eib-local
displayName: EIB Local MCP Catalog

registry:
  eib-mcp-rag:
    title: EIB MCP RAG Server
    description: AI-powered code analysis and EE2 compliance checking for NOAA Global Workflow
    type: server
    image: eib-mcp-rag-python:latest
    env:
      - name: DB_BACKEND
        value: "cots"
      - name: MCP_TENANT_CATALOG_PATH
        value: "/app/mcp_server_python/src/config/tenants.yaml"
      - name: MCP_WORKFLOW_MOUNT
        value: "/app/.pw_workflow_mount"
      - name: CHROMADB_HOST
        value: "172.17.0.1"
      - name: CHROMADB_PORT
        value: "8080"
      - name: CHROMADB_URL
        value: "http://172.17.0.1:8080"
      - name: NEO4J_URI
        value: "bolt://172.17.0.1:7687"
      - name: NEO4J_USER
        value: neo4j
      - name: NEO4J_PASSWORD
        value: gfsworkflow2025
      - name: MCP_WORKFLOW_ROOT
        value: "/app/supported_repos/global-workflow_develop"
      - name: MCP_SCENARIO
        value: full
      - name: ENABLE_RAG
        value: "true"
      - name: ENABLE_GITHUB
        value: "true"
    # docker-mcp classifies GITHUB_TOKEN as a secret and will not pass it through
    # as a plain `-e` env var. It must be declared here and its value supplied via
    # the gateway's `--secrets <.env>` switch (see mcp-gateway.service drop-in,
    # fed from the shell secrets.env SPOT). `env:` maps the secret into the
    # container as $GITHUB_TOKEN, matching what the github_tools module reads.
    secrets:
      - name: GITHUB_TOKEN
        env: GITHUB_TOKEN
    volumes:
      - "/mcp_rag_eib/eib-mcp-rag-server/.pw_workflow_mount:/app/.pw_workflow_mount:ro"
      - "/mcp_rag_eib/eib-mcp-rag-server/mcp_server_python/src/config/tenants.yaml:/app/mcp_server_python/src/config/tenants.yaml:ro"
      - "/mcp_rag_eib/eib-mcp-rag-server/supported_repos:/app/supported_repos:ro"
      # HuggingFace model cache (all-mpnet-base-v2) for the mpnet768 local
      # embedding profile — reused from the host/Spack install so the COTS
      # server embeds queries offline (HF_HUB_OFFLINE=1), matching the stdio
      # server byte-for-byte.
      - "/mcp_rag_eib/cache/huggingface:/app/.hf_cache:ro"
      # sdd_framework must be read-write: the SDD session tools persist
      # active_session.json + history.jsonl under execution_state/ at runtime.
      - "/mcp_rag_eib/eib-mcp-rag-server/sdd_framework:/app/mcp_server_python/sdd_framework:rw"
    metadata:
      category: devops
      tags:
        - noaa
        - gfs
        - mcp
        - rag
