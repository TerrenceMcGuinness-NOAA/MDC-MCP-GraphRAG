# Docker MCP Gateway - Complete Stack
# Phase 11: Dockerized MCP Server with Gateway Integration
#
# This compose file sets up the MCP RAG server for Docker MCP Gateway access.
# It includes ChromaDB, Neo4j, and the MCP server.
#
# Usage:
#   docker compose -f docker-compose.mcp.yaml up -d
#   docker mcp catalog import mcp_server_node/docker-mcp-catalog.yaml
#   docker mcp server enable eib-mcp-rag
#   docker mcp gateway run --port 8090 --transport streaming
#
# Access:
#   - MCP Tools: via Docker MCP Gateway (stdio)
#   - ChromaDB API: http://localhost:8080/api/v2
#   - Neo4j Browser: http://localhost:7474

version: '3.8'

services:
  # ChromaDB Vector Database
  # CRITICAL: Mount to /data (ChromaDB default persist_path in container config)
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    hostname: chromadb
    ports:
      - "8080:8000"
    volumes:
      - ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/chromadb:/data:Z
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - global-workflow-mcp-rag

  # MCP RAG Server - Exposed to Docker MCP Gateway
  # Image pulled from NOAA VLab GitLab Container Registry
  mcp-rag-server:
    build:
      context: ./mcp_server_node
      dockerfile: Dockerfile
    image: ${IMAGE_MCP_SERVER:-registry.gitlab-licensed.vlab.noaa.gov/nws/operations/ncep/emc/eib/eib-mcp-rag-server:latest}
    container_name: eib-mcp-rag
    hostname: mcp-rag
    environment:
      - MCP_SCENARIO=${MCP_SCENARIO:-full}
      - NODE_ENV=production

      # ChromaDB connection (Docker container in same network)
      - CHROMA_SERVER_URL=http://chromadb:8000
      - CHROMADB_URL=http://chromadb:8000

      # Neo4j connection (Docker container)
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-gfsworkflow2025}

      # Global Workflow paths (for file analysis tools)
      - MCP_WORKFLOW_ROOT=${MCP_WORKFLOW_ROOT:-/mcp_rag_eib/eib-mcp-rag-server/supported_repos/global-workflow}
      - MCP_WORKSPACE_ROOT=${MCP_WORKSPACE_ROOT:-/mcp_rag_eib/eib-mcp-rag-server}
      - SDD_FRAMEWORK_ROOT=${SDD_FRAMEWORK_ROOT:-/mcp_rag_eib/eib-mcp-rag-server/sdd_framework}

      # Feature flags
      - ENABLE_RAG=${ENABLE_RAG:-true}
      - ENABLE_GITHUB=${ENABLE_GITHUB:-true}

      # GitHub integration (optional)
      - GITHUB_TOKEN=${GITHUB_TOKEN}

    # Mount repositories for code analysis tools
    volumes:
      - ${MCP_WORKSPACE_ROOT:-/mcp_rag_eib/eib-mcp-rag-server}:/mcp_rag_eib/eib-mcp-rag-server:ro

    # Connect to host for ChromaDB access (fallback if not using container)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Connect to existing Neo4j container
    networks:
      - global-workflow-mcp-rag

    # No ports exposed - MCP Gateway connects via docker exec (stdio)
    # stdin_open: true  # Uncomment for interactive debugging
    # tty: true         # Uncomment for interactive debugging

    # Wait for ChromaDB and Neo4j to be ready
    depends_on:
      - chromadb
      - neo4j

    restart: unless-stopped

    # Health check - verify server can start
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    labels:
      # Docker MCP Gateway discovery labels
      - "mcp.server=true"
      - "mcp.name=eib-mcp-rag"
      - "mcp.description=EIB MCP RAG Server for Global Workflow Analysis"
      - "mcp.version=3.0.0"
      - "mcp.transport=stdio"

  # Neo4j Graph Database (reuse from existing stack)
  # If neo4j is already running, comment this out and use external network
  # Image pulled from NOAA VLab GitLab Container Registry
  neo4j:
    image: ${IMAGE_NEO4J:-registry.gitlab-licensed.vlab.noaa.gov/nws/operations/ncep/emc/eib/eib-mcp-rag-server/neo4j:5.15.0}
    container_name: global-workflow-neo4j
    hostname: neo4j
    ports:
      - "7474:7474"  # HTTP (Neo4j Browser)
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-gfsworkflow2025}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-gfsworkflow2025} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - global-workflow-mcp-rag

# Persistent data volumes
volumes:
  neo4j-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/data

  neo4j-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/logs

  neo4j-import:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/import

  neo4j-plugins:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/plugins

# Custom network (shared with existing stack)
networks:
  global-workflow-mcp-rag:
    external: true
    name: global-workflow-mcp-rag
