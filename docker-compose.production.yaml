# docker-compose.production.yaml
# Environment: env/production branch
# Purpose: Production deployment - CI/CD ONLY
#
# CRITICAL: This file should NEVER be run manually.
# Deployment is handled exclusively by GitLab CI/CD pipeline.
#
# MCP_ENV: production
# Access: CI/CD pipeline only, no manual access

services:
  # ============================================================================
  # ChromaDB Vector Database (Production)
  # ============================================================================
  chromadb:
    image: ${CI_REGISTRY:-registry.gitlab-licensed.vlab.noaa.gov}/nws/operations/ncep/emc/eib/eib-mcp-rag-server/chromadb:v134clean
    container_name: chromadb-production
    ports:
      - "8080:8000"
    volumes:
      - chromadb-production-data:/chroma/chroma
    environment:
      - CHROMA_HOST=0.0.0.0
      - CHROMA_PORT=8000
      - ANONYMIZED_TELEMETRY=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ============================================================================
  # Neo4j Graph Database (Production)
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: neo4j-production
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-production-data:/data
      - neo4j-production-logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PRODUCTION_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=2G
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ============================================================================
  # MCP RAG Server (Production)
  # ============================================================================
  mcp-server:
    image: ${CI_REGISTRY:-registry.gitlab-licensed.vlab.noaa.gov}/nws/operations/ncep/emc/eib/eib-mcp-rag-server/mcp-server:env-production
    container_name: mcp-server-production
    depends_on:
      chromadb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - MCP_ENV=production
      - MCP_SCENARIO=full
      - ENABLE_RAG=true
      - CHROMA_SERVER_URL=http://chromadb:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_AUTH=neo4j/${NEO4J_PRODUCTION_PASSWORD}
      # Production security settings
      - NODE_ENV=production
      - LOG_LEVEL=warn
    volumes:
      - mcp-server-production-logs:/app/logs
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

# CRITICAL: All volumes use bind mounts to persistent storage on /mcp_rag_eib
# /var/lib/docker/volumes/ is ephemeral on VMs and will be lost on reprovisioning
volumes:
  chromadb-production-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/chromadb
  neo4j-production-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/data
  neo4j-production-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/neo4j/logs
  mcp-server-production-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PERSISTENT_ROOT:-/mcp_rag_eib}/data/mcp-server/logs

networks:
  default:
    name: mcp-production-network
