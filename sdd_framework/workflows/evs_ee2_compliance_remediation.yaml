# ==============================================================================
# AUTOMATED REMEDIATION TOOLS
# ==============================================================================

tools:
  error_handling_insertion:
    script: "tools/add_error_handling.sh"
    description: "Automatically insert error handling after shebang"
    usage: |
      #!/bin/bash
      set -eu
      for script in scripts/{stats,prep,plots}/**/*.sh; do
          if ! grep -q "^set -e" "$script"; then
              cp "$script" "${script}.bak"
              sed -i '2i\\nset -eu\nset -o pipefail\n' "$script"
              echo "Added error handling to: $script"
          fi
      done
    
  variable_quoting:
    script: "tools/quote_variables.sh"
    description: "Automatically quote environment variables"
    usage: |
      #!/bin/bash
      set -eu
      for script in scripts/{stats,prep,plots}/**/*.sh; do
          cp "$script" "${script}.bak"
          sed -i 's/cd \$\([A-Z_]*\)/cd "${\1}"/g' "$script"
          sed -i 's/mkdir -p \$\([A-Z_]*\)/mkdir -p "${\1}"/g' "$script"
          sed -i 's/export \([A-Z_]*\)=\$\([A-Z_]*\)/export \1="${\2}"/g' "$script"
          echo "Quoted variables in: $script"
      done
    warning: "Manual review required - some glob expansions are intentional"
    
  compliance_scanner:
    script: "tools/scan_compliance.sh"
    description: "Scan repository for EE2 compliance issues"
    usage: "bash tools/scan_compliance.sh <directory> > compliance_report.txt"
    
  regression_tester:
    script: "tools/run_regression_tests.sh"
    description: "Compare outputs between baseline and fixed scripts"
    usage: "bash tools/run_regression_tests.sh <baseline_dir> <new_dir>"

