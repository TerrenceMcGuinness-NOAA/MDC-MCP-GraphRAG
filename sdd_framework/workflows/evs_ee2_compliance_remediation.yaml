# ==============================================================================
# COMPLIANCE STANDARDS REFERENCE
# ==============================================================================

standards:
  error_handling:
    required:
      - "set -eu after shebang (exit on error, undefined variables)"
      - "set -o pipefail (catch errors in pipes)"
      - "Trap handlers for cleanup on failure"
      - "Input data validation before processing"
      - "Error messages with context (script, operation, state)"
    
  environment_variables:
    required:
      - "Quote all variable references: \"${VAR}\" or \"$VAR\""
      - "Never use $VAR unquoted in production code"
      - "Validate variables before use: ${VAR:?Variable not set}"
    
  code_standards:
    required:
      - "Follow Google Shell Style Guide"
      - "Use shellcheck for static analysis"
      - "Meaningful function and variable names"
      - "Comments for complex logic only (code should be self-documenting)"

