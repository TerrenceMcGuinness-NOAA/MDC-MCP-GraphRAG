# EVS EE2 Compliance Remediation Workflow
# SDD Framework Integration
# Date: November 18, 2025
# Repository: NOAA-EMC/EVS (release/evs.v2.0.0)

metadata:
  workflow_name: evs_ee2_compliance_remediation
  version: "1.0.0"
  created: "2025-11-18"
  author: "MCP RAG System"
  repository: "NOAA-EMC/EVS"
  branch: "release/evs.v2.0.0"
  gist_url: "https://gist.github.com/TerrenceMcGuinness-NOAA/fae7ea2c59c7ebb5cca40dae09a78959"
  
description: |
  Systematic remediation of 670 non-compliant files (97.2% of repository) to meet
  NCEP Central Operations EE2 standards for production deployment on WCOSS2.
  
  Critical Issues:
  - 225 files lack error handling (set -e, set -u, trap handlers)
  - 631 files contain unquoted environment variables
  - Overall compliance: 2.8% (19/689 files)
  
  Estimated Effort: 260-330 developer hours (8-10 weeks with 1-2 FTEs)

objectives:
  - Achieve 100% EE2 compliance for operational scripts
  - Implement robust error handling across all shell scripts
  - Quote all environment variables to prevent expansion errors
  - Add input validation and trap handlers
  - Maintain backward compatibility and output accuracy
  - Establish CI/CD enforcement of compliance standards

phases:
  - phase_1_critical_path
  - phase_2_secondary_components
  - phase_3_remaining_scripts
  - phase_4_validation_documentation

# ==============================================================================
# PHASE 1: CRITICAL PATH SCRIPTS (Weeks 1-3)
# ==============================================================================

phase_1_critical_path:
  name: "Phase 1: Critical Path Scripts"
  duration: "3 weeks"
  effort_hours: 128
  priority: "P0"
  
  description: |
    Fix the 32 highest-priority scripts that run in critical operational paths:
    mesoscale (RAP/NAM CONUS forecasts), global_det (GFS), RTOFS (ocean),
    subseasonal (extended forecasts), and NWPS (coastal waves).
  
  target_files: 32
  
  components:
    mesoscale:
      files: 6
      scripts:
        - scripts/stats/mesoscale/exevs_stats_mesoscale_rap_snowfall.sh
        - scripts/stats/mesoscale/exevs_stats_mesoscale_rap_precip.sh
        - scripts/stats/mesoscale/exevs_stats_mesoscale_rap_grid2obs.sh
        - scripts/stats/mesoscale/exevs_stats_mesoscale_nam_snowfall.sh
        - scripts/stats/mesoscale/exevs_stats_mesoscale_nam_precip.sh
        - scripts/stats/mesoscale/exevs_stats_mesoscale_nam_grid2obs.sh
      owner: "Developer A"
      criticality: "CONUS forecasts - mission critical"
      
    global_det:
      files: 4
      scripts:
        - scripts/stats/global_det/exevs_stats_global_det_wave_grid2obs.sh
        - scripts/stats/global_det/exevs_stats_global_det_atmos_wmo.sh
        - scripts/stats/global_det/exevs_stats_global_det_atmos_grid2obs.sh
        - scripts/stats/global_det/exevs_stats_global_det_atmos_grid2grid.sh
      owner: "Developer B"
      criticality: "GFS deterministic - operational backbone"
      
    rtofs:
      files: 2
      scripts:
        - scripts/stats/rtofs/exevs_stats_rtofs_grid2obs.sh
        - scripts/stats/rtofs/exevs_stats_rtofs_grid2grid.sh
      owner: "Developer A"
      criticality: "Ocean forecasts - high visibility"
      issues:
        - "82 unquoted variables in grid2grid (worst file in repo)"
        - "69 unquoted variables in grid2obs"
        - "No input data validation"
      
    subseasonal:
      files: 2
      scripts:
        - scripts/stats/subseasonal/exevs_stats_subseasonal_grid2obs.sh
        - scripts/stats/subseasonal/exevs_stats_subseasonal_grid2grid.sh
      owner: "Developer B"
      criticality: "Extended forecasts - climate operations"
      
    nwps:
      files: 1
      scripts:
        - scripts/stats/nwps/exevs_nwps_wave_grid2obs_stats.sh
      owner: "Developer A"
      criticality: "Coastal wave forecasts - public safety"
  
  tasks:
    - task_id: "P1-001"
      name: "Add error handling to all P0 scripts"
      steps:
        - "Insert 'set -eu' and 'set -o pipefail' after shebang"
        - "Add trap handlers for cleanup on failure"
        - "Validate all required environment variables"
        - "Check input file/directory existence before processing"
      
    - task_id: "P1-002"
      name: "Quote all environment variables"
      steps:
        - "Convert all $VAR to \"${VAR}\""
        - "Review intentional glob expansions (keep unquoted if needed)"
        - "Add braces for consistency: $VAR → ${VAR}"
      
    - task_id: "P1-003"
      name: "Add error checking for critical operations"
      steps:
        - "Check return codes for cd, mkdir, cp, mv commands"
        - "Add error messages with context (script name, operation, expected state)"
        - "Ensure Python/external commands exit on failure"
      
    - task_id: "P1-004"
      name: "Create unit tests for each fixed script"
      steps:
        - "Test script exits on undefined variable"
        - "Test script exits on missing input files"
        - "Test script exits on permission errors"
        - "Test error messages are informative"
      
    - task_id: "P1-005"
      name: "Regression testing on operational data"
      steps:
        - "Run fixed scripts on 30 days of operational data"
        - "Compare output with baseline (must match exactly)"
        - "Verify performance degradation <5%"
        - "Document any differences requiring investigation"
  
  deliverables:
    - "32 P0 scripts fully EE2 compliant"
    - "Unit test suite for P0 scripts"
    - "Regression test results (pass/fail report)"
    - "Code review documentation"
    - "Performance benchmark results"
  
  acceptance_criteria:
    - "All 32 scripts have set -eu and set -o pipefail"
    - "All environment variables quoted"
    - "Input validation present in all scripts"
    - "Error messages include context and actionable information"
    - "Unit tests pass for all error conditions"
    - "Regression tests show identical output to baseline"
    - "Performance degradation <5%"

